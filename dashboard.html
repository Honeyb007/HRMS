<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - HRMS Akunza</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="./frontend/css/style.css">
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="sidebar-brand">
      <i class="fa-solid fa-notes-medical"></i>
      <div>HRMS<span class="sb-sub">Akunza PHC</span></div>
    </div>
    <nav>
      <a href="dashboard.html" class="active"><i class="fa-solid fa-user-injured"></i> Patients</a>
      <a href="users.html" id="usersLink" hidden><i class="fa-solid fa-users"></i> Manage Users</a>
      <a href="profile.html"><i class="fa-solid fa-id-badge"></i> Profile</a>
    </nav>
    <div class="sidebar-footer">
      <div class="sf-name" id="userName"></div>
      <span class="sf-role" id="userRole"></span>
      <button class="btn btn-outline btn-sm btn-block" onclick="logout()">
        <i class="fa-solid fa-right-from-bracket"></i> <span>Logout</span>
      </button>
    </div>
  </aside>

  <div class="shell-main">
    <div class="shell-content">

      <div class="page-title">
        <div>
          <h1>Patients</h1>
          <p>Search existing patients or register a new one.</p>
        </div>
        <button class="btn btn-primary" onclick="openPatientPanel()">
          <i class="fa-solid fa-user-plus"></i> Register New Patient
        </button>
      </div>

      <div class="card">
        <div class="search-row">
          <input type="text" id="searchInput" placeholder="Search by patient name...">
        </div>

        <div class="table-responsive"><table>
          <thead>
            <tr>
              <th>Name</th>
              <th>Gender</th>
              <th>Date of Birth</th>
              <th>Phone</th>
              <th>Blood Group</th>
            </tr>
          </thead>
          <tbody id="patientTableBody"></tbody>
        </table></div>

        <div id="emptyState" class="empty-state" hidden>
          <i class="fa-solid fa-user-injured"></i>
          <p>No patients found.</p>
        </div>
      </div>

    </div>
  </div>
</div>

<!-- Register Patient Panel -->
<div class="panel-overlay" id="patientPanelOverlay" hidden>
  <div class="panel">
    <h2>Register New Patient</h2>
    <p class="panel-sub">Enter the patient's basic information.</p>

    <form id="patientForm">
      <div class="field">
        <label for="pFullName">Full Name</label>
        <input type="text" id="pFullName" required>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="pGender">Gender</label>
          <select id="pGender" required>
            <option value="">Select</option>
            <option value="Male">Male</option>
            <option value="Female">Female</option>
          </select>
        </div>
        <div class="field">
          <label for="pDob">Date of Birth</label>
          <input type="date" id="pDob" required>
        </div>
      </div>

      <div class="two-col">
        <div class="field">
          <label for="pPhone">Phone</label>
          <input type="text" id="pPhone" required placeholder="080...">
        </div>
        <div class="field">
          <label for="pBloodGroup">Blood Group (optional)</label>
          <input type="text" id="pBloodGroup" placeholder="O+">
        </div>
      </div>

      <div class="field">
        <label for="pAddress">Address</label>
        <input type="text" id="pAddress" required>
      </div>

      <div id="patientErrorBox" class="error-box" hidden></div>

      <div class="panel-actions">
        <button type="button" class="btn btn-outline" onclick="closePatientPanel()">Cancel</button>
        <button type="submit" class="btn btn-primary" id="patientSubmitBtn">
          <i class="fa-solid fa-check"></i> Register Patient
        </button>
      </div>
    </form>
  </div>
</div>

<script src="./frontend/js/auth.js"></script>
<script src="./frontend/js/dashboard.js"></script>
</body>
</html>
