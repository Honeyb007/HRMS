<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - HRMS Akunza</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="./frontend/css/style.css">
</head>
<body class="auth-body">

  <div class="auth-wrap">
    <div class="auth-brand">
      <i class="fa-solid fa-notes-medical"></i>
      <h1>HRMS</h1>
      <p>Primary Health Care Centre, Akunza</p>
    </div>

    <div class="auth-card">
      <h2>Sign in</h2>
      <p class="auth-sub">Staff access only. Contact your administrator if you don't have an account.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required placeholder="you@akunzaphc.com">
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required placeholder="••••••••">
        </div>

        <div id="errorBox" class="error-box" hidden></div>

        <button type="submit" id="loginBtn" class="btn btn-primary btn-block">
          <i class="fa-solid fa-right-to-bracket"></i> Sign in
        </button>
      </form>
    </div>

    <p class="auth-footer">Health Record Management System &middot; Internal Staff Portal</p>
  </div>

<script src="./frontend/js/auth.js"></script>
<script>
  document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const btn = document.getElementById('loginBtn');
    const errorBox = document.getElementById('errorBox');

    errorBox.hidden = true;
    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Signing in...';

    try {
      await loginUser(email, password);
      window.location.href = 'dashboard.html';
    } catch (err) {
      errorBox.textContent = err.message || 'Login failed. Check your credentials.';
      errorBox.hidden = false;
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Sign in';
    }
  });
</script>
</body>
</html>
